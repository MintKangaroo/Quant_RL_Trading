    title: "LightGBM 랭커 1차"
    what: "피처 13개로 비선형 모델(LightGBM)이 종목 순위를 배우게 했다."
    result: 기각
    why: "점수 정확도(IC) −0.0006 대 fundamental +0.0769, 7구간 전부 열세. 학습창에서 강했던 피처가 다음 20세션엔 예측력 0 이었다."
    doc: docs/protocols/ranker-2026-08-27.md
