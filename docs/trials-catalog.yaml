# 시행 카탈로그 — 사람이 쓴 요약. 판정은 원문 문서에서 옮긴 것이다(새로 내리지 않는다).
# 대시보드 학습 탭 ③ '과거 학습 내역' 의 원천. date 는 판정(결과)이 난 날 — as_of 로 거른다.
lessons:
  - text: "배우는 목적과 채점하는 기준이 같아야 학습이 이긴다. 순위로 채점하면서 수익률을 가르친 랭커는 졌고, 목적을 순위로 바꾸자 이겼다."
    source: docs/rl-postmortem.md
    date: "2026-09-04"
  - text: "같은 재료는 같은 답을 낸다. 모델·목적·입력을 바꿔도 점수 정확도는 거의 그대로였다 — 병목은 알고리즘이 아니라 정보다."
    source: docs/trials-postmortem.md
    date: "2026-09-22"
  - text: "매매 비용은 알파의 일부가 아니라 대부분이다. 랭커 상위 24 는 비용 전 연 +31.7% 가 비용 후 +5.2% 였다 — 덜 갈아타는 것이 가장 큰 개선이었다."
    source: docs/rl-postmortem.md
    date: "2026-09-04"
trials:
  # ── 강화학습(RL) 회차 — docs/rl-postmortem.md ─────────────────────────
  - id: "카나리"
    date: "2026-08-23"
    category: RL
    title: "오라클 카나리 배관 점검"
    what: "정답(미래 수익)을 몰래 보여 주고 학습 장치가 그것을 배우는지 확인했다."
    result: 보류
    why: "배관은 정상이었다. 다만 합격 기준(기여도 10배)이 돈 버는 것과 무관한 것을 쟀고, 필요한 학습량의 0.7% 만 주고 '못 배운다' 고 오판했다 — 기준을 필요조건 셋으로 바꿨다."
    doc: docs/rl-postmortem.md
    ledger: ["retro-rl-canary"]
  - id: "M4-1"
    date: "2026-08-25"
    category: RL
    title: "배분 RL 1회차"
    what: "규칙이 고른 24종목의 비중을 강화학습(PPO)으로 나눴다. 38.6시간 학습."
    result: 기각
    why: "보상이 학습 내내 −0.017 에서 안 움직였고, 정책은 현금으로 도망갔다(6.5% → 13.8%). 손익만 보상으로 주면 '덜 행동하기' 부터 배운다."
    doc: docs/rl-postmortem.md
  - id: "M4-2"
    date: "2026-08-29"
    category: RL
    title: "배분 RL 2회차"
    what: "1회차 결함을 고쳐 다시 학습. 첫 판(r5)은 관측값에 환율 원값 1,478 이 들어간 코드 결함으로 중단하고 고친 뒤 완주했다."
    result: 기각
    why: "학습 구간에선 균등가중을 이겼지만 안 본 구간(OOS)에선 졌다. 배운 것은 현금 타이밍뿐이었고 그것을 통째로 외운 것이었다."
    doc: docs/rl-postmortem.md
  - id: "M4-3"
    date: "2026-09-01"
    category: RL
    title: "배분 RL 3회차 파일럿"
    what: "현금 고정·보유 상태 출발·검증 구간으로 체크포인트 선택 — 외울 자유도를 뺀 설계."
    result: 기각
    why: "정책 결정의 95% 가 실제로 집행됐는데도 균등가중과 차이가 0 이었다. 상위 24 안에서 비중을 바꿔 얻을 알파가 없다 — 레버는 '얼마씩' 이 아니라 '무엇을' 이다."
    doc: docs/rl-postmortem.md
  - id: "E2E-베타"
    date: "2026-09-02"
    category: RL
    title: "매매 전반 RL 베타"
    what: "선정·비중·회전을 신경망 하나가 한 번에 정하게 했다(2,872종목 전체에 비중)."
    result: 기각
    why: "학습 구간에서 종목 하나를 외워 +360~680% 를 냈다(유효 종목 1). 안 본 구간의 점수 정확도(IC)는 fundamental 의 절반이었다."
    doc: docs/protocols/e2e-rl-2026-09.md
  - id: "M4-4"
    date: "2026-09-04"
    category: RL
    title: "랭커 위 배분 RL 4회차"
    what: "후보를 랭커로 바꾸고 보상 기준선을 후보 균등가중으로 맞춘 뒤 비중 배분을 다시 학습."
    result: 기각
    why: "파일럿에서 검증 우위가 마지막 셋 모두 음수(−0.00004·−0.00007·−0.00004)로 불합격. 3회차와 같은 그림이라 배분 RL 은 여기서 닫았다."
    doc: docs/protocols/drl-round4-2026-09.md
  - id: "M4-5"
    date: "2026-09-04"
    category: RL
    title: "매매 전반 DRL 마지막"
    what: "지난 실패마다 장치를 하나씩 넣고(비중 상한·잔차 정책·비용 반영 등) 매매 전반을 다시 학습."
    result: 기각
    why: "장치는 다 작동했지만 대조보다 연 −41%p(t −2.96), 낙폭도 더 깊었다. 학습 구간에서조차 못 올랐다 — 외운 게 아니라 배울 신호가 없었다."
    doc: docs/protocols/e2e-drl-final-2026-09.md
    ledger: ["e2e-drl-final-2026-09:M4-5"]

  # ── 2026-08-27 선정·랭커 ─────────────────────────────────────────────
