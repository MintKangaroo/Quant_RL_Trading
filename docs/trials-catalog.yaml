    what: "점수를 업종(KSIC 24군) 안에서 따로 표준화해 업종 쏠림을 없앴다."
    result: 기각
    why: "섹터 중립화는 기각 — 채택 기준(점수 정확도 개선 t ≥ 2)을 못 넘었다."
    doc: docs/protocols/selection-2026-08-27.md
