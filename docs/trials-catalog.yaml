  # ── 9/2 벤치마크·베타 탐색 (기록만) ─────────────────────────────────
  - id: "베타 오버레이"
    date: "2026-09-02"
    category: 노출
    title: "지수 헤지·변동성 조절"
    what: "지수를 공매도해 시장 몫을 걷거나(헤지), 변동성이 큰 날 비중을 줄였다."
    result: 보류
    why: "넷 다 기록만. 지수가 연 +153% 오른 창이라 헤지는 정의상 손실이다 — 이 표본으로는 헤지를 잴 수 없다는 것을 확인했다."
    doc: docs/protocols/beta-overlay-2026-09.md
  - id: "베타 정렬"
    date: "2026-09-02"
    category: 선정
    title: "베타 맞춘 종목 선정"
    what: "포트의 시장 민감도(β)를 지수에 가깝게 맞추도록 종목을 골랐다."
    result: 보류
    why: "셋 다 기록만. 어떻게 골라도 β 가 0.4~0.6 에 머물렀다 — 유니버스 자체의 β 가 0.4 라서, 동일가중 24 로는 시총가중 지수를 못 쫓는다."
    doc: docs/protocols/beta-aligned-selection-2026-09.md
  - id: "벤치마크 정렬 1"
    date: "2026-09-02"
    category: 선정
    title: "지수 닮은 구성 1차"
    what: "시총 상위 200 안에서 고르고 시총가중으로 담는 등 구성을 지수에 붙였다."
    result: 보류
    why: "등록 기준으로는 기록만. CAP200 이 지수를 연 +63%p 이겼지만 β 1.21 이 남았고 대용 지수 오차가 판정을 가렸다."
    doc: docs/protocols/benchmark-aligned-construction-2026-09.md
  - id: "벤치마크 정렬 2b"
    date: "2026-09-02"
    category: 선정
    title: "지수 닮은 구성 2차"
    what: "대용 지수를 고치고 β 를 1.0 에 묶어 다시 쟀다."
    result: 보류
    why: "셋 다 기록만. 1차의 '+63%p' 는 SK하이닉스 한 종목이 포트의 6할이었던 결과였다 — 알파가 아니라 한 종목 베팅."
    doc: docs/protocols/benchmark-aligned-construction-2b-2026-09.md

