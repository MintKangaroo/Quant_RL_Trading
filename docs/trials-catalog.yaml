  - id: "랭커B-0827"
    date: "2026-08-27"
    category: 랭커
    title: "LightGBM 랭커 2차"
    what: "재무 피처 7개만, 학습창을 늘리고 모델을 얕게 해서 다시."
    result: 기각
    why: "IC +0.018 대 fundamental +0.081. 같은 피처의 선형 결합도 +0.027 — 이 표본에선 데이터로 가중을 배우는 것 자체가 손으로 정한 부호보다 못했다."
    doc: docs/protocols/ranker-2026-08-27b.md
    ledger: ["ranker-lgbm-b-2026-08-27"]

