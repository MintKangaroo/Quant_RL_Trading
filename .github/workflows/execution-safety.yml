name: execution-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: Order, broker and durable-claim regressions
        run: uv run pytest tests/executor/ tests/broker/ tests/store/test_concurrent_append.py
