name: execution-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: Order, broker and durable-claim regressions
        run: uv run pytest tests/risk/ tests/executor/ tests/broker/ tests/collectors/test_order_events.py tests/store/test_concurrent_append.py -m 'not warehouse'
      - name: Point-in-time research regressions
        run: uv run pytest tests/analysts/test_ranker_feature_contract.py tests/collectors/test_us_universe_panel.py tests/invariants/test_reference_data.py
      - name: Financial calculation regressions
        run: uv run pytest tests/accounting/ tests/backtest/test_stats.py tests/backtest/test_evaluation_boundary.py tests/rl/test_reward.py tests/rl/test_reward_net_contract.py
      - name: Portfolio constraint regressions
        run: uv run pytest tests/portfolio/test_constraints.py tests/portfolio/test_projection_safety.py tests/allocator/test_risk_parity_baseline.py
      - name: Rule sessions without optional RL packages
        run: uv run pytest tests/session/test_daily.py
      - name: Repository invariants
        run: uv run pytest tests/invariants/
