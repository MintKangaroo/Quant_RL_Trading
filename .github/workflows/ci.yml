name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # M1 완료 기준: datetime.now() 직접 호출 0건, 데이터 직접 조회 0건
      - name: invariants
        run: uv run pytest tests/invariants/ -v
