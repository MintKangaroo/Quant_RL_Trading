name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      # **불변식이 맨 앞이고, 이것만 CI 를 빨갛게 만든다.**
      # M1 완료 기준: datetime.now() 직접 호출 0건, 데이터 직접 조회 0건 (CLAUDE.md "커밋 전 필수").
      #
      # 2026-08-12 부터 ruff 가 맨 앞에서 1,745건(대부분 줄 길이)으로 멈춰, 이 단계가 GitHub 에서
      # 한 달 넘게 한 번도 돌지 않았다 — CI 는 아무것도 지키지 못하고 실패 메일만 보냈다(2026-09-19).
      - name: invariants
        run: uv run pytest tests/invariants/ -v

      # 형식·타입 검사는 **기록만 한다**(continue-on-error). 전수 확인에서 실제 버그는 0개였다
      # (README "린트 전수 확인"). 정리가 끝나면 continue-on-error 를 떼서 다시 관문으로 올린다.
      - name: ruff (report only)
        continue-on-error: true
        run: uv run ruff check . --statistics

      - name: mypy (report only)
        continue-on-error: true
        run: uv run mypy
