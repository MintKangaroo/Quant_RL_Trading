# Lattice 임계치 기본값.
#
# 이 파일은 시딩 소스일 뿐이고, 정본은 store 의 config 테이블이다.
# 값을 바꾸면 새 revision 행으로 들어가며 과거 조회 결과는 바뀌지 않는다.
# 코드에서 숫자를 하드코딩하지 않는다 — 불변식 10.

[rl]
# 액션 반영률. RL 결정 중 실제로 집행된 비율이 이 아래면 경고.
# 그건 RL 이 아니라 룰 시스템이다. (CLAUDE.md 재발 방지 지표)
action_reflection_warn = 0.30

[analyst]
# 이 IC 를 넘기기 전까지 새 Analyst 는 가중치 0(관찰 모드)이다.
ic_threshold = 0.03
ic_min_sample_days = 200

[execution]
# 충격비용 = k × 변동성 × √(주문량 / 일평균거래량)
impact_k = 0.1
# 하루 거래량 중 우리가 차지할 수 있는 최대 비율.
participation_cap = 0.03
# 이 일수 안에 청산 불가능한 크기는 애초에 들어가지 않는다.
liquidation_days = 3
# 이보다 작은 주문은 수수료로 잡아먹힌다. 단위: 원.
min_order_value = 100000.0

[collector]
# 킬스위치가 보는 수집 오류율. 이 창 안에서 최소 표본 이상 모였을 때만 판단한다.
# 표본이 적을 때 성급히 끄면 잡음 하나로 파이프라인이 멈춘다.
error_rate_window_sec = 120.0
error_rate_min_samples = 8
# 호출 이력을 들고 있는 롤링 윈도.
call_history_sec = 600.0

[data]
# 백테스트에 쓰는 파이프라인 지연. 실측 p90 으로 갱신하기 전의 보수적 초기값.
assumed_latency_seconds = 300

[backfill]
# 백필 기본 구간.
years = 5

# 일봉 공표 지연 — 세션 종료로부터 그 날 봉을 실제로 알 수 있게 되기까지.
# 백필 레코드의 observed_at 은 "세션 종료 지역시각 + 이 지연" 이다.
# 이 값을 0 으로 두면 마감 종소리와 동시에 종가를 알았다는 뜻이 되고,
# 마감 직후를 노리는 전략의 백테스트가 통째로 낙관 편향된다.
kr_publication_lag_seconds = 1800   # 15:30 마감 → 16:00 공표
us_publication_lag_seconds = 1200   # 16:00 마감 → 16:20 공표

# 세션 간 호출 간격. 소스를 두들겨 차단당하지 않기 위한 예의.
session_pause_ms = 200

# 공매도는 세션 당일에 나오지 않는다. 거래일 단위로 이만큼 늦춰 관측시각을
# 찍는다. 0 으로 두면 flow_kr 이 통째로 미래를 본다.
shorting_lag_days = 2

[data_quality]
# 거래일 커버리지가 이 아래면 경고. 데이터가 조용히 새는 것을 잡는 첫 방어선.
coverage_warn = 0.98
# 결측률이 이 위면 경고.
missing_warn = 0.01
# 수집 지연 p90 이 이 위면 경고. data.assumed_latency_seconds 와 같은 뜻이다.
latency_p90_warn_ms = 300000
# 화면 기본 조회 창.
default_lookback_days = 90
# 상한. 화면 하나가 창고를 통째로 메모리에 올리지 않게 막는다.
max_lookback_days = 400
# 최근 실패 표에 띄울 행 수.
failure_rows = 50
