# IX-T 트랙 — "K200 − TTM 제로샷 예측 하위 10%" × V6 노출 (docs/protocols/ixt-tsfm-losers-2026-10.md). 이 샌드박스에서만 읽힌다.
# 무엇을: 거래가능 KOSPI200 구성종목에서 tsfm 신호(전날 밤 계산, 하루 늦춤) 하위 10% 를 뺀다 — 위험 하한 자리를 tsfm 으로. 나머지는 IX0 와 같다.
# 끄는 것: 완충(exit_rank = n_candidates), 위험 하한, 섹터 상한, 상관 감점 — 그대로 두면 "하위 10% 만 뺀다" 가 아니게 된다.
# 그대로인 것: 노출 배수(V6)·재조정 10세션·집행(4조각)·비용·최소 주문금액.
