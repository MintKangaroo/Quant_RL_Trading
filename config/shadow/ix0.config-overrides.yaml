# IX0 트랙(대조) — 같은 배관의 "K200 전부(제외 없음)" × V6 노출 — 복제 오차와 제외 효과를 가른다 (docs/protocols/ix-index-minus-losers-2026-10.md). 이 샌드박스에서만 읽힌다.
# 무엇을: 거래가능 KOSPI200 구성종목 전부(n 200 > 구성 수 — 점수로 빼지 않는다). 얼마씩: 유동시총 가중, 종목 상한 30%. 나머지는 IX 와 한 글자도 다르지 않다.
# 끄는 것: 완충(exit_rank = n_candidates), 위험 하한, 섹터 상한, 상관 감점 — 그대로 두면 "하위 10% 만 뺀다" 가 아니게 된다.
# 그대로인 것: 노출 배수(V6)·재조정 10세션·집행(4조각)·비용·최소 주문금액.
