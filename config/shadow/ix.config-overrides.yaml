# IX 트랙 — "K200 − 랭커 하위 10%" × V6 노출 (docs/protocols/ix-index-minus-losers-2026-10.md). 이 샌드박스에서만 읽힌다.
# 무엇을: KOSPI200 구성종목 중 실전 선정 점수 상위 166 — 10/7 기준 거래가능 K200 184종목의 90%(= 하위 10% 제외). 유니버스 필터(거래대금·상장일·관리종목)를 지난 K200 만 센다. 얼마씩: 유동시총 가중, 종목 상한 30%.
# 끄는 것: 완충(exit_rank = n_candidates), 위험 하한, 섹터 상한, 상관 감점 — 그대로 두면 "하위 10% 만 뺀다" 가 아니게 된다.
# 그대로인 것: 노출 배수(V6)·재조정 10세션·집행(4조각)·비용·최소 주문금액.
