# AR 미장 shadow — docs/design/c1-ar-shadow.md '미장' · 시행 AR(금고 early 두 시장 통과). scripts/run_shadow_ar_us.sh 가 첫 실행에
# data/_ar_us_shadow/config-overrides.yaml 로 복사한다. 이 샌드박스에서만 읽힌다(실전 창고는 덮어쓰기 파일을 거부한다). 미장 세션만 돈다.
# 나머지는 현행 미장 shadow 규칙 그대로. 바꾸는 것은 알파 자리 하나 — 미장 키(`_us`)가 공통 키보다 먼저 읽힌다(selector.weights).
# 체크인 기본값 weights_override_us 는 {} 라 이 줄이 없으면 측정 가중치로 돈다 — 그래서 미장 키로 적는다.
selector.weights_override_us:
  ar_insider: 1.0
  risk: 1.0

# 10/13 실전 전환 전 값 고정(tools/apply_switch.py) — 실전이 바뀌어도 이 장부는 그대로다.
selector.n_candidates: 24
selector.exit_rank: 72
selector.rebalance_every: 10
selector.swap_min_z: 0.0
selector.rebalance_anchor: "2026-09-28"
risk.max_positions: 30
dashboard.ir_reset_date: "2026-11-26"
