# Quant_RL_Trading 임계치 — 유일한 출처.
#
# 불변식 10: 임계치는 store.config 에서 읽는다. 하드코딩 금지.
# 같은 숫자가 학습·Executor·대시보드·리포트 네 곳에 흩어지면 반드시 어긋난다.
# 12%를 13%로 바꿨는데 화면만 12%를 보여주는 상황이 실제로 일어난다.
#
# 이 파일은 시딩 소스일 뿐이고, 정본은 store 의 config 테이블이다.
# 값을 바꾸면 발효 시점을 갖는 새 revision 행으로 들어가며,
# 과거 as_of 조회 결과는 바뀌지 않는다 — 작년 백테스트가 재현돼야 하기 때문이다.
#
# 변경 시 config_version 을 올린다. "이 성과가 어느 설정에서 나왔나" 를
# 나중에 추적할 수 있어야 한다.

config_version: 1

# -----------------------------------------------------------------------------
# 투자철학·회계 규칙 — 하이퍼파라미터가 아니다. Optuna 탐색 공간에 넣지 않는다.
# -----------------------------------------------------------------------------

reward:
  drawdown_free: 0.12        # 자유구간 — 낙폭 페널티 0
  drawdown_warn: 0.22        # 페널티 급증 시작
  drawdown_hard: 0.30        # 에피소드 종료 / 킬스위치
  w_free: 0.0
  w_mid: 1.5
  w_hot: 8.0
  terminal_penalty: -10.0
  normalize_returns: return_std   # none | return_std | popart

benchmark:
  kr_weight: 0.5
  us_weight: 0.5
  # ⚠️ **가격지수(PR)다. 총수익지수(TR)가 아니다.** 목표는 TR 이지만
  # (accounting.md §7) 2026-08-14 실측으로 KRX Open API·LS t1511·FRED 세 곳 다
  # TR 도 배당수익률 필드도 주지 않는다 — 진짜 TR 은 유료 라이선스가 필요하다.
  # 그동안 우리는 배당을 받고 벤치마크는 못 받으므로, 국내 대형주 기준
  # **연 2~3%p 만큼 우리가 이긴 것처럼 보인다.** 같은 경고가 nav.blended_benchmark
  # 독스트링 · tables.py 의 benchmark_index 설명 · 화면 배지에도 있다.
  #
  # 이름은 **창고에 실제로 있는 entity_id 그대로**다. (~~코스피·코스닥·
  # 나스닥은 그 이름으로 창고에 없었다~~ — 아래 2026-08-15 참고, 이제 코스피는
  # 있다.) KRX 300 을 "코스피" 라 부르는 것이 더 큰 거짓말이므로 대용치로
  # 바꿔치기하지 않는다는 원칙 자체는 그대로다 — 그래서 이름이 생기자마자 바꿨다.
  # 2026-08-15 KRX 300 → 코스피. 대표지수는 통합 경로(/idx/krx_dd_trd)에 없고
  # 시장별 경로(/idx/kospi_dd_trd)에 있다 — 수집기가 통합 경로만 불러서 그동안
  # 창고에 없었다. 이제 2020-08 부터 1,468행 들어와 있고 KRX 300(2022-04~)보다
  # 창이 넓다. 실전 nav_daily 가 0행일 때 바꿨으므로 이어붙일 사슬이 없었다.
  kr_index: KR:IDX:KOSPI
  us_index: US:IDX:SP500
  total_return: false        # TR 을 받게 되면 위 두 이름과 함께 true 로 바꾼다
  base_value: 100.0
  # 직전 지수 종가를 **찾아볼** 창(일). 휴장인지 구멍인지는 날짜가 아니라 그
  # 시장의 거래일 달력으로 가른다(benchmark.py) — 날짜로 재면 설 연휴가 구멍이
  # 되고 3일짜리 수집 실패가 휴장이 된다. 이 값은 연휴를 덮을 만큼만 넓으면
  # 된다. 설·추석이 주말과 붙으면 국장이 9일까지 쉰다.
  max_staleness_days: 10

accounting:
  base_currency: KRW
  snapshot_time: "15:40"     # 한국시간, 하루 1회
  dividend_recognition: ex_date    # ex_date | payment_date (ex_date 고정)
  dividend_tax_kr: 0.154
  dividend_tax_us: 0.15
  capital_gains_us: 0.22     # 충당금으로만. 일간 NAV 미반영
  capital_gains_allowance_krw: 2500000   # 해외 양도세 기본공제(연간)
  return_method: TWR
  # 매매 비용. 체결가에 녹이지 않고 따로 든다 — 녹이면 나중에 비용만 따로
  # 볼 수 없고, 슬리피지 실측과 수수료를 구분할 수 없다.
  fee_kr: 0.00015           # 위탁수수료(편도). 증권사·약정에 따라 다르다
  fee_us: 0.0025            # 해외주식 위탁수수료(편도)
  transaction_tax_kr: 0.0018  # 증권거래세 — **매도에만** 붙는다

# -----------------------------------------------------------------------------
# 매매
# -----------------------------------------------------------------------------

universe:
  # **절대 하한** — 아무리 자본이 작아도 이보다 안 거래되는 종목은 안 산다.
  # 소액 시절엔 이 상수가 전부였는데, 자본이 커지면 아래 배수가 이것을 넘어선다.
  min_turnover_20d_kr: 500000000     # 원
  min_turnover_20d_us: 1000000       # 달러
  # **자본에서 유도하는 유동성 하한의 배수** (portfolio-construction.md §부록).
  # 실효 하한 = max(min_turnover_20d_kr, turnover_capacity_multiple × 자본).
  #
  # 용량 항등식: 목표금액이 max_adv_ratio 상한에 안 잘리려면
  #     ADV ≥ (목표비중 / max_adv_ratio) × 자본.
  # 배수 1.6 은 전형적 포지션(~5%, 실현 최대비중 4.79% 와 일치)을 목표비중에
  # 넣은 값 — 5%/3% ≈ 1.6. max_position_weight(15%) 를 넣으면 5.0 이 되는데,
  # 15% 캡은 실현된 적이 없어(2026-08 실측 최대 4.79%) 있지도 않은 캡을
  # 보호하려 유니버스를 절반으로 깎게 된다.
  #
  # 자본 5억 실측(2026-08-22, tools/measure_liquidity_floor.py):
  #     상수 5억  통과 1208 · 최대비중 용량충족 48% ← 절반이 잘린다
  #     1.6×(8억) 통과  997 · 용량충족 58%          ← 채택
  #     5.0×(25억)통과  579 · 용량충족 100%
  # 0 으로 두면 배수를 끄고 절대 하한만 쓴다.
  #
  # **KR 에만 적용한다.** 자본(NAV)은 원화이고 KR 거래대금도 원화라 바로
  # 비교되지만, US 거래대금은 달러라 환산 없이는 못 건다. 미장 자본·환율
  # 처리가 설계되기 전까지 US 는 절대 하한만 쓴다 (us-market-deferred).
  turnover_capacity_multiple: 1.6
  # **순위 하한** — 절대 하한을 통과한 뒤 상위 N 만 남긴다. 0 이면 끄고 절대 하한만 쓴다.
  # 하한(원 단위)은 자본이 커지면 따라 오르지만 시장 전체가 얼어붙은 날에는 의미가 없다.
  # 순위는 그날의 시장을 기준으로 잘라서 "가장 잘 거래되는 것들" 을 남긴다.
  # **켜기 전에 사전등록 시행으로 잰다**(docs/protocols/universe-rank-2026-09.md) — 유니버스를
  # 좁히는 것은 알파를 늘리는 것이 아니라 후보를 줄이는 것이고, 둘은 다른 사실이다.
  top_turnover_rank: 0       # 20일 평균 거래대금 상위 N 종목
  top_volume_rank: 0         # 20일 평균 거래량(주수) 상위 N 종목
  top_market_cap_rank: 0     # 시가총액 상위 N 종목
  min_listed_days: 180
  max_price_ratio: 0.15      # 1주 가격 / 자본
  exclude_flags: [관리종목, 거래정지, 정리매매]

execution:
  # **주문을 실제로 내보낼지.** 기본은 false — 켤 때만 나간다.
  # ~~LS 모의투자 appkey 로는 주문 TR(CSPAT*) 자체가 막혀 있다~~ — **틀렸다.**
  # 2026-08-15 실측: 모의 appkey 로도 t0424(잔고)가 정상 응답했다. 모의투자는
  # 잔고 조회도 주문도 되는 것이 정상이다. 그러니 "모의라서 안 나간다" 에
  # 기대지 마라 — 나가는 것을 막는 것은 이 플래그와 아래 지문 고정뿐이다.
  # 2026-08-22: **모의투자 계좌로 켰다.** 아래 account_mode 가 paper 이므로
  # 나가는 곳은 LS 모의서버다(지문 164cccf81af0). 실전으로 가려면 account_mode
  # 를 real 로 바꿔야 하고, 그 순간 이 플래그가 이미 켜져 있다는 뜻이다 —
  # **한 줄이 실전과 모의를 가른다.** 그 한 줄을 바꿀 때는 지문·선언·자본을
  # 같이 확인할 것 (docs/design/ls-api.md §모의/실전 구분).
  live_trading: true
  # **주문을 낼 계좌를 지문으로 고정한다.** 빈 문자열이면 고정 안 함.
  # 코드는 모의·실전을 판별할 수 없다 — 같은 호스트를 쓰고, 모의 appkey 로도
  # t0424(잔고)가 정상 응답한다(2026-08-15 실측). 그래서 사람이 `.env` 의
  # `LS_ACCOUNT_KIND` 로 선언하고, 그 선언을 이 지문에 묶는다. `.env` 가
  # 바뀌면 지문이 달라져 주문 도구가 거부한다 — "모의인 줄 알았다" 를 막는
  # 유일한 방법이다. 값은 sha256(appkey)[:12] 이라 키를 되돌릴 수 없다.
  live_account_fingerprint: ""   # 배포마다 다르다 — 창고(store.config)에 넣는다
  # **어느 계좌로 나갈지.** paper | real. 2026-08-22 추가.
  #
  # LS 증권은 모의와 실전을 **엔드포인트가 아니라 appkey 로 가른다** — 호스트가
  # `openapi.ls-sec.co.kr:8080` 으로 같다. URL 로는 구분이 불가능하므로 `.env` 에
  # 두 키 묶음(`LS_*` 실전 / `LS_PAPER_*` 모의)을 나란히 두고 여기서 고른다.
  #
  # **기본값이 paper 인 이유**: 설정을 못 읽거나 값이 이상하면 모의로 간다.
  # 모르는 상태에서 실전으로 흐르는 경로를 만들지 않는다.
  account_mode: paper
  # 모의투자 계좌 지문. sha256(LS_PAPER_APPKEY)[:12].
  # **모의 경로는 빈 값이면 거부한다** — 국장 실전의 "빈 값 = 고정 안 함" 규약을
  # 새 경로에 물려주지 않는다(미장과 같은 규칙). 2026-08-22 실측 확인.
  live_account_fingerprint_paper: "164cccf81af0"
  # 미장은 **별도 appkey** 라 지문이 다르다(LS_US_APPKEY). 한 칸으로 두 시장을
  # 고정할 수 없어 키를 나눴다 — 스칼라 하나에 얹으면 둘 중 하나는 반드시
  # 고정이 풀린다. 국장과 달리 **빈 값이면 미장 주문 도구가 거부한다**:
  # 새로 만드는 경로라 처음부터 조인다(tools/verify_live_order.py).
  # 값은 sha256(LS_US_APPKEY)[:12] — 2026-08-15 실측으로 확인했다.
  live_account_fingerprint_us: "20cf550a301f"
  # 일 거래대금 대비 매수 상한. **2026-08-28 사용자 결정: 0.03 → 1.0** — 5억 자본에서
  # 후보의 43% 가 3% 상한에 잘려 전략이 왜곡됐다(portfolio-construction.md §부록). 모의계좌
  # 단계라 체결 가능성보다 전략 원형을 보는 것이 먼저다. 1.0 = 주문 하나가 하루 거래대금을
  # 넘지 않는다는 최소 상식선. **실전 전환 전에 다시 조인다** — 실전에서 3% 는 충격비용과
  # 미체결을 막는 보호막이다.
  max_adv_ratio: 1.0
  max_liquidation_days: 3
  defer_minutes: 30          # 개장 후 신규매수 보류
  order_type: limit          # 시장가는 청산·킬스위치에만
  max_slippage: 0.005
  slice_count: 4
  slice_interval_sec: 60
  retry_after_sec: 300
  max_retries: 3
  # 체결 시뮬레이터. 충격비용 = impact_k × 변동성 × √(주문량 / 일평균거래량)
  # 슬리피지를 고정값으로 두면 소형주 수익률이 뻥튀기된다.
  impact_k: 0.1
  min_order_value: 100000.0  # 이보다 작은 주문은 수수료가 잡아먹는다. 단위: 원
  # 매도 대금이 예수금이 되기까지의 거래일. 국내 주식은 D+2 다.
  # **0 으로 두면 오늘 판 돈으로 오늘 살 수 있게 된다** — 증권사가 담보로
  # 허용하는 편의이지 우리 설계에 있는 것이 아니다 (accounting.md §1:
  # "미결제 대금 때문에 NAV가 있어도 못 산다").
  settlement_days: 2

selector:
  n_candidates: 24
  # **위험 하한 — risk 의 자리다** (태스크 #32). risk 는 알파 합성에서 빠지고
  # (selector/constraints.py) 대신 그날 점수가 매겨진 종목 중 위험 하위
  # 이 비율을 잘라낸다. 0 이면 제약을 끈다.
  #
  # 왜 알파에서 뺐나: `low_volatility .45 + low_beta .20` 이 급등 대형주를
  # 65% 의 축에서 벌준다. 2026-01~08 실측으로 펀드 +16.17% / 코스피 +58.10%,
  # 알파 -41.93%p 였고 주식비중은 81.3% 였다 — 현금을 쥐어서가 아니다.
  # risk 를 빼면 삼전 676→169위, 하이닉스 1088→533위. 절반으로 줄이면
  # 933/1356 으로 어중간해서, 문제가 세기가 아니라 자리라는 것이 확인됐다.
  #
  # 0.20 인 이유: 거래대금 하한(universe.min_turnover_20d_kr)이 이미 유동성
  # 축을 거르므로 여기서 노리는 것은 변동성·베타 꼬리다. 더 키우면 제약이
  # 다시 알파처럼 굴기 시작한다 — 자르는 비율이 커질수록 "안 위험한 것"
  # 안에서의 줄세우기에 가까워진다.
  risk_floor_percentile: 0.20
  corr_threshold: 0.7
  corr_penalty: 0.3
  sector_cap: 0.35
  # 완충 구간 (selector.md §5). 보유 종목은 순위가 이 안이면 후보에 남긴다.
  # 진입은 n_candidates(24). 2026-08-27 사전등록 시행: 회전 5.6→1.3회/년.
  exit_rank: 48
  population: 64
  generations: 40
  # 적합도 페널티 둘. **기준은 연율화 샤프 1.0**(진짜로 좋은 전략)이다 —
  # 실측 IR 로 잡으면 15일 폴드의 잡음을 config 에 박게 된다.
  #
  # l1: Σ|w| 최대 = 애널리스트 수 3 → 항 최대 0.09, 샤프 1.0 의 9%.
  # 옛값 0.01 은 항 최대가 0.03 이라 실측 IR 대비 0.22% — **사실상 0 이었다.**
  # selector.md §3 이 "L1 이 핵심" 이라 했는데 회전율 항(0.138)의 1/5 도
  # 못 밀었다. 희소화가 일어난 적이 없다.
  l1_penalty: 0.03
  # 회전율 페널티. 여태 evolution.py 의 모듈 상수였다 — 임계치가 코드에 박혀
  # 있으면 화면·학습 설정과 어긋난다(불변식 10).
  #
  # 옛 상수 0.05 는 **적합도 스케일이 바뀌기 전 값**이다. IR 을 연율화한 뒤로
  # 회전율도 연율 환산되어(실측 연 45) 항이 2.26 이 된다 — 적합도를 통째로
  # 지배한다. 0.005 면 항이 0.22 로 샤프 1.0 의 22%.
  turnover_penalty: 0.005
  # 세대 체크포인트. 진화는 몇 시간짜리 작업이고 이 기계는 램을 다른 작업과
  # 나눠 쓴다 — 2026-08-15 새벽 16×15 가 3시간 돌다 죽었는데 세대 기록이 한
  # 줄도 안 남았다. 중단은 예외가 아니라 기본값이라 보고 매 세대 남긴다.
  checkpoint_dir: logs/evolution
  checkpoint_every: 1
  # 한 세대에서 뽑는 두 폴드의 **최소 시작일 간격(달력일)**. 0 이면 겹침을
  # 안 본다 — 실제로 seed 0 · 15거래일 폴드에서 15세대 중 네 세대가 두 폴드
  # 시작일 2~6일 차이로 뽑혀 13일가량 겹쳤고, 그 세대의 "다중 시작일 중앙값"
  # 방어는 폴드 하나짜리였다. 15거래일 ≈ 21달력일이라 21로 둔다 — 기본
  # fold_days 20 까지 겹치지 않는다. fold_days 를 더 키우면 이 값도 키워라.
  min_fold_gap_days: 21

# 노출 제어(③) — **얼마나 살지.** 무엇을 살지는 selector 가 정한다.
#
# chart Analyst 가 여기로 온 이유는 selector/exposure.py 에 있다: 상태 피처
# 여덟을 새로 만들어 재도 횡단면 랭크 IC 는 전부 미달이었지만(최고
# bb_squeeze +0.0180), **변동성 압축이 이후 변동성을 맞히는 것은 82만 행에서
# 단조로 살아남았다**(5분위 0.857→0.940→1.014→1.073→1.179).
#
# 세 축을 곱하지 않고 **가장 낮은 것**을 따른다. 곱하면 셋이 조금씩 낮을 때
# 0.6×0.7×0.8 = 0.336 이 되어 아무도 위험하다고 말하지 않았는데 3분의 1이 된다.
exposure:
  # 지수가 200일 이평 아래일 때의 배수. 1.0 이면 이 축을 끈다.
  # 0.6 인 이유: 방어는 참여를 줄이는 것이지 나가는 것이 아니다. 절반 아래로
  # 내리면 되돌아오는 구간을 통째로 놓친다 — 2026-06 이후 펀드가 코스피를
  # +24.97%p 이긴 것이 그런 구간이었다.
  below_trend: 0.6
  # 국면별 배수. analysts/regime.py 의 상태 이름 그대로.
  # **bull·volatile 은 1.0** — 변동성이 높다고 무조건 줄이면 상승 변동까지 버린다.
  # unknown 도 1.0 이다: 모른다는 것은 위험하다는 뜻이 아니고, 줄이면 지수
  # 이력이 짧은 백테스트 초입마다 까닭 없이 절반만 사게 된다.
  regime_scale:
    bull: 1.0
    volatile: 1.0
    bear: 0.7
    crisis: 0.5
    unknown: 1.0
  # 변동성 압축일 때의 배수. 압축은 "곧 크게 움직인다" 를 맞히지만 "어느 쪽"
  # 은 못 맞힌다(평균수익·승률이 분위 간 차이 없음). 방향을 모른 채 크기만
  # 커지면 걸어 둔 돈을 줄인다.
  squeezed: 0.8
  # 압축으로 볼 백분위. **절대폭이 아니라 자기 과거 120세션 대비**다 —
  # 절대폭으로 재면 저변동 종목만 뽑혀 low_volatility 를 복제한다.
  squeeze_quantile: 0.20
  # 국면 배수 확인 기간. 최근 N 세션 국면 배수의 **최솟값**을 쓴다 — 낮추는 것은
  # 즉시, 올리는 것은 N 세션 연속 확인 뒤. 2026-08-22~27 에 crisis↔volatile 이
  # 하루걸러 뒤집혀 shadow 가 절반을 팔았다 사는 왕복을 했다(20일 모멘텀 부호 하나가
  # 가른다). 1 이면 옛 동작(현재 국면만).
  regime_confirm_sessions: 2

allocator:
  action_reflection_floor: 0.30   # 미만이면 경고 — RL이 아니라 룰 시스템이다
  # M3 룰 베이스라인. equal | score | score_inverse_vol | risk_parity
  #
  # **2026-09-01 risk_parity 로 바꿨다** (§7 비교, 사용자 확정). 그 전까지 score 였고
  # 이유는 "RL 의 진짜 경쟁자를 세운다" 였는데, §7 이 그보다 나은 경쟁자를 찾았다:
  #
  #   구간 2026-04~06 (하락장)   수익      MDD
  #   score                    -11.76%   -26.92%
  #   risk_parity               -1.28%   -19.37%
  #
  # 수익·낙폭 **둘 다** 이겼다. 이 비교가 늦은 이유는 섹터 표를 30일 창으로 읽어
  # 못 찾는 버그 때문에 risk_parity 가 76/76 세션 score 로 폴백해, 몇 달간 두 팔의
  # NAV 가 바이트 단위로 같았기 때문이다(SECTOR_LOOKBACK_DAYS=None 으로 수정).
  # 회전율은 더 높다(6.78 vs 4.98) — 비용 후 초과수익 판정에서 주시할 것.
  baseline: risk_parity
  max_position_weight: 0.15   # 한 종목이 이보다 커지면 분산이 아니다
  cash_buffer: 0.05           # 체결·수수료·환율 오차를 흡수할 여유
  # -----------------------------------------------------------------------------
  # 리스크 패리티 베이스라인 (§3, portfolio-construction.md).
  # baseline: risk_parity 일 때만 읽는다. **RL env(allocator/env.py)는 안 읽으므로
  # RL 캐시 지문(allocator/cache.py CONFIG_DEPENDENCIES)에 넣지 않는다** — 넣으면
  # 룰 손잡이 하나 바꿀 때마다 RL 캐시가 깨진다(카나리를 죽였던 그 사고).
  # -----------------------------------------------------------------------------
  # 스코어 틸트 공격성. 0 이면 순수 리스크 패리티, 크면 스코어 비례에 가까워진다.
  # w ∝ 기준선 × exp(score_tilt · score). **RL 할인율 gamma(0.997)와 다른 것** —
  # 이름을 나눈 이유가 이것이다. 진화 탐색 대상이 될 자리다.
  score_tilt: 1.0
  # 단일 종목 리스크 기여 상한(§3-3). **비중 상한이 아니라 위험 기여 상한이다** —
  # 저변동성 종목은 비중 21%라도 위험 기여는 15%일 수 있다(설계 의도).
  # RC 합은 1 이라 이 값이 c 면 종목이 1/c 개 이상이라야 만족한다(0.15→7종목).
  name_risk_cap: 0.15
  # 섹터 리스크 기여 상한. 섹터가 1/0.35≈3 개 이상이라야 만족 가능.
  sector_risk_cap: 0.35
  # 하방 베타 가중평균 상한. 넘으면 저베타 쪽으로 비중을 민다.
  downside_beta_cap: 1.0
  # 공분산·베타를 재는 창(거래일). §1·§2 와 같은 250.
  risk_window: 250
  episode_days: 250
  # **여기부터 아래는 "우리가 어떻게 학습하나" 다** (설계값).
  #
  # 이 표에는 성격이 다른 둘이 섞여 있다. 결제주기·호가단위·수수료는 "세상이
  # 어땠나" 라 과거 조회에서 그때 값이어야 하고, 슬롯 수·에피소드 길이·보상
  # 계수는 "오늘 우리가 고른 설계" 여야 한다. 불변식 5 가 "백테스트와 라이브는
  # 같은 코드를 쓴다" 고 못 박은 이유가 이것이다 — 백테스트가 2025년 슬롯
  # 수로 돌고 실전이 오늘 슬롯 수로 돌면 둘은 같은 시스템이 아니다.
  #
  # 그래서 `EnvParams.from_store` 가 시점을 둘로 나눠 읽는다. 학습·진단은
  # `hyper_as_of` 를 주고, 백테스트는 안 준다(그때 설계로 재현이 목적이므로).
  #
  # 실측 2026-08-20: 이 갈래가 없던 때 30 → 15 로 바꾸고 돌렸더니 **마지막
  # 자리까지 똑같은 숫자**가 나왔다. 오류가 아니라 조용히 옛 값이었다.
  #
  # 오라클 카나리가 두 번 불합격했는데 기여도 순위는 2위/28 이라 그래디언트는
  # 정답 칸에 흐르고 있었다. `tools/diagnose_allocation.py` 로 재 보니:
  #
  #   α 변동계수      0.003 → 0.095   정책은 선호를 배운다
  #   목표 유효종목수   12.0  → 13.0    그런데 13종목에 퍼뜨린다
  #   실현 유효종목수    8.6  →  5.1    집행하면 5종목으로 접힌다
  #   액션 반영률      0.54  → 0.40    판단의 60%가 사라진다
  #
  # 종목 간 차이를 10% 정도로만 말하는데, 30칸에 나눠 담으니 한 칸이 작고
  # 작은 비중은 주식 수로 내리면 0주가 된다. **말하는 크기가 집행 단위보다
  # 작다.** 칸을 줄여 한 자리를 키운다.
  #
  # 학습률을 올려 더 세게 말하게 하는 길도 있지만 그쪽은 발산한다(1e-4 에서
  # 한 스텝에 배분 13%). 이 값은 되돌리기가 한 줄이라 먼저 재 본다.
  #
  # **RL 환경만 읽는다**(allocator/env.py 한 곳). 실전 후보 선정과 무관하다.
  n_max_candidates: 30
  gamma: 0.997
  gae_lambda: 0.95
  # -----------------------------------------------------------------------------
  # 학습한 정책을 **실제 장부**에 끼우는 스위치 (allocator/live.py, session/daily.py).
  # checkpoint 가 비면 어디서도 정책을 쓰지 않는다. modes 는 store/mode.py 의
  # 코드 — paper(모의계좌)만 켜고 shadow 는 룰로 두면 둘이 같은 날 같은 후보로
  # 병주해 RL 과 룰을 나란히 본다 (rl-training.md §13). 실전(live)은 승격 심사 뒤.
  # **RL 캐시 지문에 넣지 않는다** — 환경은 이 값을 안 읽는다 (cache.CONFIG_INDEPENDENT).
  rl:
    checkpoint: ""
    modes: ["paper"]
  # RL 환경(allocator/env.py) 전용. 학습에서만 읽는다.
  env:
    # 에피소드 시작 자본. **실계좌 잔고와 무관하다** — 학습은 같은 구간을
    # 수천 번 되풀이하므로 자본이 그때그때 다르면 최소 주문금액·라운딩이
    # 만드는 액션 반영률의 상한도 같이 흔들려, 성적 차이가 정책 때문인지
    # 자본 때문인지 구분할 수 없다.
    initial_capital: 100000000.0
    # 진입 지연 액션의 상한(거래일). 선택지는 0~이 값이라 Categorical(4) 가
    # 여기서 나온다 (rl-training.md §1). 4 를 코드에 박으면 상한을 바꿀 때
    # 액션 공간과 설정이 조용히 어긋난다.
    max_entry_delay_days: 3
    # 한미 정책금리차 피처가 읽는 macro_releases 의 entity_id.
    # benchmark.kr_index 와 같은 종류의 값이다 — 창고에 실제로 있는 이름을
    # 코드가 짐작하지 않게 설정으로 든다.
    # **`indices` 의 이름이다. `macro_releases` 가 아니다.**
    # 그 표는 "언제 무엇이 발표되나" 를 담는 일정 표라 valid_from 이 수집
    # 시각이고, 과거 as_of 로 조회하면 한 행도 안 걸린다 — RL 환경의 금리차
    # 칸이 200k 스텝 내내 0 이었던 이유가 이것이다(2026-08-19).
    kr_policy_rate_series: "KR:RATE:BASE"
    us_policy_rate_series: "US:RATE:FED_FUNDS"

fx:
  rebalance_deadband: 0.10   # 10%p 넘을 때만 환전
  rebalance_weekday: FRI

killswitch:
  drawdown_trigger: 0.30
  order_fail_rate: 0.10
  liquidate_on_trigger: false     # 기본은 신규매수만 차단

backtest:
  # OOS 백테스트 MDD 상한. 킬스위치(0.30)보다 낮게 잡는 이유는 백테스트 MDD 가
  # 실전에서 거의 항상 더 나쁘기 때문이다 (reward-and-risk.md §승격 게이트).
  mdd_promotion_gate: 0.20
  # 성적에 넣지 않고 신호만 쌓는 선행 구간. confidence 가 60거래일 롤링 IC 라
  # 이력이 없으면 0 이고, 0 이면 합성 점수가 비어 아무것도 사지 않는다.
  warmup_days: 70

capital:
  gate_min_trading_days: 60
  gate_max_order_fail_rate: 0.01
  gate_max_missing_rate: 0.005
  gate_slippage_tolerance: 0.30
  step_multiplier: 2.5

# -----------------------------------------------------------------------------
# 분석
# -----------------------------------------------------------------------------

analyst:
  ic_threshold: 0.03         # 이 아래면 가중치 0(관찰 모드)
  ic_min_samples: 200        # 표본이 모자란 IC 는 우연과 구분되지 않는다
  # 합성점수 IC 의 t(Newey-West) 하한. 크기 게이트(0.03)의 뒷받침이다 —
  # 변동성이 큰 잡음은 크기를 요행으로 넘는다(chart 급 std 0.13 이면 IC 0.03
  # 이어도 t≈1.8). 2026-08-25 실측: 통과 3종 t 4.5~7.7 · 미통과 최고 2.04 라
  # 이 값(2.0)을 걸어도 현재 판정은 하나도 안 바뀐다 — 미래의 요행만 막는다.
  ic_t_min: 2.0
  ic_rolling_window: 60      # confidence 계산 창
  horizon_days: 5
  retrain_ic_floor: 0.01     # 이하로 떨어지면 재학습
  block_ratio_cap: 0.30      # 뉴스·SNS 하루 거부 상한
  verdict_ttl_days: 5

thirteen_f:
  # 13F 를 종목 축으로 읽을 때(store/holdings.py) 그 분기를 쓸지 판단하는
  # 하한. CUSIP→티커 매핑은 **스냅샷이라 낡는다** — 새 분기에 편입된 종목의
  # CUSIP 은 tools/map_cusip_tickers.py 를 다시 돌리기 전까지 매핑이 없고,
  # 그러면 그 분기가 조용히 반쪽만 들어온다. 행이 0 이 되면 알아채지만
  # **그럴듯하게 줄어들면 아무도 못 알아챈다.**
  #
  # 종목 수가 아니라 **금액 비중**으로 재는 이유: 13F 는 꼬리에 아주 작은
  # 보유가 길게 붙어 있어서(RenTech 한 분기 3,200종목) 종목 수로 재면 큰
  # 것 하나가 빠져도 티가 안 난다.
  min_mapped_value: 0.8

llm:
  monthly_budget_usd: 100   # 2026-08-30 사용자가 50 → 100 으로 올림
  news_screen_model: haiku
  news_deep_model: sonnet
  review_model: sonnet
  # 실제 청구 통화(USD)→원화 환산용. 대시보드 표시 참고치일 뿐, 청구는 USD.
  usd_krw_rate: 1450
  # 모델별 단가 — $/1M 토큰. 출처: claude-api 스킬 캐시(2026-06-24 기준,
  # platform.claude.com/docs/en/pricing 원본) + Anthropic 표준 캐시 배수
  # (cache_write = input×1.25, 5분 TTL / cache_read = input×0.1 — 모델 무관,
  # 참고 구현 ls_kr_rl_trader/dashboard/ai_review.py 의 opus-4-8 단가와 같은 공식).
  # 확인일: 2026-08-14. Sonnet 5 는 2026-08-31까지 도입가($2/$10)가 있으나
  # 그 뒤 정가로 돌아가므로 여기는 정가($3/$15)를 싣는다 — 안 그러면 도입가
  # 만료 때마다 config 를 또 고쳐야 한다. llm_usage.model 에 찍히는 실제 모델
  # 문자열(analysts/news_screen.py·macro_brief.py 의 MODEL 상수)과 키가 같아야
  # 화면이 단가를 찾는다 — 못 찾으면 "단가 모름" 으로 표시하지 0 으로 채우지 않는다.
  pricing:
    claude-opus-5:
      input_per_mtok: 5.00
      output_per_mtok: 25.00
      cache_write_per_mtok: 6.25
      cache_read_per_mtok: 0.50
    claude-sonnet-5:
      input_per_mtok: 3.00
      output_per_mtok: 15.00
      cache_write_per_mtok: 3.75
      cache_read_per_mtok: 0.30
    claude-haiku-4-5:
      input_per_mtok: 1.00
      output_per_mtok: 5.00
      cache_write_per_mtok: 1.25
      cache_read_per_mtok: 0.10

# -----------------------------------------------------------------------------
# 수집 — 구현하면서 실제로 필요했던 것들
# -----------------------------------------------------------------------------

collector:
  # 킬스위치가 보는 수집 오류율. 표본이 적을 때 성급히 끄면 잡음 하나로
  # 파이프라인이 멈춘다.
  error_rate_window_sec: 120.0
  error_rate_min_samples: 8
  call_history_sec: 600.0

backfill:
  years: 5
  # 일봉 공표 지연 — 세션 종료로부터 그 날 봉을 실제로 알 수 있게 되기까지.
  # 백필 레코드의 observed_at 은 "세션 종료 지역시각 + 이 지연" 이다.
  # 0 으로 두면 마감 종소리와 동시에 종가를 알았다는 뜻이 된다.
  kr_publication_lag_seconds: 1800    # 15:30 마감 → 16:00 공표
  us_publication_lag_seconds: 1200    # 16:00 마감 → 16:20 공표
  # 공매도는 세션 당일에 나오지 않는다. 거래일 단위로 늦춰 찍는다.
  # 0 으로 두면 flow_kr 이 통째로 미래를 본다.
  shorting_lag_days: 2
  session_pause_ms: 200      # 소스를 두들겨 차단당하지 않기 위한 예의
  # DART 는 공시 '날짜' 만 준다. 시각은 모른다. 그날 이 시각(KST)에 알게 됐다고
  # 본다 — 접수 마감이 18시이므로 그 이후로 잡으면 절대 낙관적이지 않다.
  dart_publication_hour_kst: 18
  # SEC EDGAR 도 공시 '날짜' 만 준다. 접수 마감이 17:30 ET 이므로 그 이후로
  # 잡으면 절대 낙관적이지 않다 — 그날 낸 공시는 다음 세션부터 반영된다.
  # (미장 일봉 관측시각이 16:20 ET 라 같은 날 공시는 그날 시총에 안 들어간다.)
  sec_filing_hour_et: 18

collectors:
  # 원본이 그 세션 값을 **낸다고 실측으로 확인한** 시각. 세션 마감 뒤 시간(h).
  #
  # 수집이 0행으로 끝났을 때 그것이 "원본이 안 냈다" 인지 "우리가 못 받았다"
  # 인지를 이 값 하나가 가른다 (collectors/outcome.py). 이 시각 전의 0건은
  # "나중에 다시" 이고, 지난 뒤의 0건은 **실패로 나간다**(rc≠0).
  #
  # **없는 데이터셋은 0건이면 실패다.** 짐작한 값을 채워 넣지 않는다 —
  # 짐작이 들어가는 순간 그 값이 확인한 사실인 척하고, 조용한 실패가 다시
  # 시작된다. 확인하면 그때 추가한다.
  #
  # 키는 `수집소스.데이터셋` 이다(entity_id 의 `:` 가 `.` 이 된다).
  available_after_hours:
    krx_openapi:
      # 실측 2026-08-19: 22:40 KST(마감 +7.2h) 에 시세 2,872행이 들어오는
      # 같은 호출이 `market_stats=0` · `indices=0` 이었고, **다음 날 06:00
      # (마감 +14.5h) 에 그대로 다시 부르니 5,744행 · 40행 · 4행이 들어왔다.**
      # 데이터가 없던 게 아니라 그 시각에 원본이 아직 안 냈던 것이다.
      #
      # 그래서 확인된 구간은 (+7.2h, +14.5h] 이고, 관측된 상한 바로 아래인
      # 14 를 쓴다. 아침 보충 수집(06:00~06:25, +14.5~14.9h)이 이 시각을
      # 지나므로 그때도 0건이면 경보가 난다 — 그 자리가 조용하던 자리다.
      # 아침에 헛경보가 나면 여기를 올린다. 코드를 고칠 일이 아니다.
      market_stats: 14
      indices: 14
      indices-board: 14
      sectors: 14

corporate_action:
  # 기업행위 판정 문턱 — |log(배율)| 이 이보다 크면 사건으로 본다.
  #
  # 계수는 LS 수정주가/원주가로 잰다(collectors/corporate_actions.py). KRX
  # 가격이 정수라 그 비율이 ±0.05% 씩 흔들린다 — 실측(KR:006740, 2025-06~
  # 2026-05)으로 2.31520~2.31664 사이를 100번 넘게 오갔다. |log| 로 0.0006
  # 수준이다.
  #
  # 위로는 **가장 작은 진짜 사건**보다 낮아야 한다. 5% 무상증자가 |log| ≈
  # 0.049 다. 0.02 는 그 사이에 넉넉히 들어간다 — 잡음의 30배, 최소 사건의
  # 40% 다.
  #
  # 올리면 소규모 무상증자를 놓치고, 내리면 반올림 잡음이 사건으로 둔갑해
  # 없는 배율이 가격에 곱해진다. 후자가 더 나쁘다.
  min_log_factor: 0.02

reporting:
  # RSI. **기간과 임계를 여기 둔다** — 화면이 자기 숫자를 들면 학습·분석과
  # 어긋난다(불변식 10).
  #
  # 14 는 Wilder 원식의 기본값이고, 70/30 은 그가 제시한 선이다. 우리가
  # 표본으로 고른 값이 아니라 **널리 쓰는 관례**라 그대로 쓴다 — 여기서
  # 우리끼리 다른 값을 정하면 메일을 읽는 사람이 아는 RSI 와 달라진다.
  #
  # 이 값은 **판단에 쓰지 않는다.** 보상 함수에도 Analyst 점수에도 안 들어
  # 간다. 메일에 적는 참고 지표다.
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30

  # 시황 브리핑 메일 — 미장 마감 후 하루 1통.
  #
  # **상승 종목의 하한이 여기 있다.** 하한이 없으면 그 섹션은 시황이 아니라
  # 동전주 목록이 된다 — 1주 100원짜리가 30% 올라도 시장이 그쪽으로 움직인
  # 것이 아니다. 거래대금·주가·순위 셋을 같이 건다. 거래대금만 걸면 저가주가
  # 호가 한 칸으로 몇 %씩 뛰는 것을 못 막고, 주가만 걸면 거래가 거의 없는
  # 고가주가 들어온다.
  #
  # 2026-08-14 세션 실측 분포로 정했다.
  #   국장 2,872종목 — 거래대금 중앙값 2.7억, 상위 10% 101억
  #   미장 6,647종목 — 거래대금 중앙값 $3.4M, 상위 10% $171M
  # 국장 10억은 대략 상위 35%, 미장 $5M 은 대략 상위 45% 선이다. 시황을
  # 말할 만큼은 거래된 종목만 남기되, 중형주까지는 남기는 자리다.
  min_turnover_krw: 1000000000    # 10억원
  min_turnover_usd: 5000000       # $5M
  # 저가주 컷. 국장 1,000원 / 미장 $1 은 관리종목·동전주가 걸리는 선이다.
  min_price_krw: 1000
  min_price_usd: 1.0
  # 절대 금액은 시장이 커지면 낡는다. 거래대금 순위 상한이 그 낡음을 덮는다.
  gainer_pool: 300
  # **5는 사용자가 지정한 개수다.** 한때 3으로 줄였다가 되돌렸다 — 좁은
  # 화면에 맞추느라 요구한 개수를 깎는 것은 읽기 편함이 아니라 내용 손실이다.
  # 한 종목이 한 줄에 들어가게 압축했으므로 표당 두 줄이 늘 뿐이다.
  ranking_rows: 5                 # 시장별 순위표 줄 수 (거래대금·시가총액)
  macro_rows: 2                   # 거시지표 발표 줄 수
  news_rows: 3                    # 시장별 뉴스 줄 수 (공시 dart 는 뺐다 — newsapi 기사)

data:
  # 백테스트에 쓰는 파이프라인 지연. 실측 p90 으로 갱신하기 전의 보수적 초기값.
  # 가정한 지연과 실제 지연의 차이가 백테스트를 거짓말로 만든다.
  assumed_latency_seconds: 300

data_quality:
  coverage_warn: 0.98        # 거래일 커버리지가 이 아래면 경고
  missing_warn: 0.01
  latency_p90_warn_ms: 300000
  default_lookback_days: 90
  max_lookback_days: 400     # 화면 하나가 창고를 통째로 올리지 않게
  failure_rows: 50

system:
  # 시스템 탭 — "지금 이 시스템이 제대로 돌고 있는가" 의 임계치.
  job_stale_warn_hours: 30   # 크론은 평일 오후에 돈다. 주말·공휴일 여유를 둔다
  table_stale_warn_days: 3   # 최근 파티션이 이보다 오래되면 경고
  cache_lookback_days: 30    # LLM 캐시 적재 현황을 보는 창

research:
  # 자기개선 안전장치 (self-improvement.md §1). 시행 예산 없는 탐색은
  # 자기기만이다 — 분기 예산을 소진하면 다음 분기까지 탐색을 멈춘다.
  trial_budget_quarter: 200
  holdout:
    # 홀드아웃 금고 시작일. "최근 12개월" 을 소급 지정할 수는 없다 —
    # 2026-06-30 까지는 이미 학습·IC·진화가 봤다. 아직 어떤 탐색도 안 본
    # 2026-07-01 이후가 유일하게 정직한 금고다. 시간이 지나며 자라난다.
    start: "2026-07-01"
