# Quant_RL_Trading 임계치 — 유일한 출처.
#
# 불변식 10: 임계치는 store.config 에서 읽는다. 하드코딩 금지.
# 같은 숫자가 학습·Executor·대시보드·리포트 네 곳에 흩어지면 반드시 어긋난다.
# 12%를 13%로 바꿨는데 화면만 12%를 보여주는 상황이 실제로 일어난다.
#
# 이 파일은 시딩 소스일 뿐이고, 정본은 store 의 config 테이블이다.
# 값을 바꾸면 발효 시점을 갖는 새 revision 행으로 들어가며,
# 과거 as_of 조회 결과는 바뀌지 않는다 — 작년 백테스트가 재현돼야 하기 때문이다.
#
# 변경 시 config_version 을 올린다. "이 성과가 어느 설정에서 나왔나" 를
# 나중에 추적할 수 있어야 한다.

config_version: 1

# -----------------------------------------------------------------------------
# 투자철학·회계 규칙 — 하이퍼파라미터가 아니다. Optuna 탐색 공간에 넣지 않는다.
# -----------------------------------------------------------------------------

reward:
  drawdown_free: 0.12        # 자유구간 — 낙폭 페널티 0
  drawdown_warn: 0.22        # 페널티 급증 시작
  drawdown_hard: 0.30        # 에피소드 종료 / 킬스위치
  w_free: 0.0
  w_mid: 1.5
  w_hot: 8.0
  terminal_penalty: -10.0
  normalize_returns: return_std   # none | return_std | popart

benchmark:
  kr_weight: 0.5
  us_weight: 0.5
  # ⚠️ **가격지수(PR)다. 총수익지수(TR)가 아니다.** 목표는 TR 이지만
  # (accounting.md §7) 2026-08-14 실측으로 KRX Open API·LS t1511·FRED 세 곳 다
  # TR 도 배당수익률 필드도 주지 않는다 — 진짜 TR 은 유료 라이선스가 필요하다.
  # 그동안 우리는 배당을 받고 벤치마크는 못 받으므로, 국내 대형주 기준
  # **연 2~3%p 만큼 우리가 이긴 것처럼 보인다.** 같은 경고가 nav.blended_benchmark
  # 독스트링 · tables.py 의 benchmark_index 설명 · 화면 배지에도 있다.
  #
  # 이름은 **창고에 실제로 있는 entity_id 그대로**다. 코스피·코스닥·나스닥은
  # 그 이름으로 창고에 없다. KRX 300 을 "코스피" 라 부르는 것이 더 큰
  # 거짓말이므로 대용치로 바꿔치기하지 않는다.
  # 2026-08-15 KRX 300 → 코스피. 대표지수는 통합 경로(/idx/krx_dd_trd)에 없고
  # 시장별 경로(/idx/kospi_dd_trd)에 있다 — 수집기가 통합 경로만 불러서 그동안
  # 창고에 없었다. 이제 2020-08 부터 1,468행 들어와 있고 KRX 300(2022-04~)보다
  # 창이 넓다. 실전 nav_daily 가 0행일 때 바꿨으므로 이어붙일 사슬이 없었다.
  kr_index: KR:IDX:KOSPI
  us_index: US:IDX:SP500
  total_return: false        # TR 을 받게 되면 위 두 이름과 함께 true 로 바꾼다
  base_value: 100.0
  # 직전 지수 종가를 **찾아볼** 창(일). 휴장인지 구멍인지는 날짜가 아니라 그
  # 시장의 거래일 달력으로 가른다(benchmark.py) — 날짜로 재면 설 연휴가 구멍이
  # 되고 3일짜리 수집 실패가 휴장이 된다. 이 값은 연휴를 덮을 만큼만 넓으면
  # 된다. 설·추석이 주말과 붙으면 국장이 9일까지 쉰다.
  max_staleness_days: 10

accounting:
  base_currency: KRW
  snapshot_time: "15:40"     # 한국시간, 하루 1회
  dividend_recognition: ex_date    # ex_date | payment_date (ex_date 고정)
  dividend_tax_kr: 0.154
  dividend_tax_us: 0.15
  capital_gains_us: 0.22     # 충당금으로만. 일간 NAV 미반영
  capital_gains_allowance_krw: 2500000   # 해외 양도세 기본공제(연간)
  return_method: TWR
  # 매매 비용. 체결가에 녹이지 않고 따로 든다 — 녹이면 나중에 비용만 따로
  # 볼 수 없고, 슬리피지 실측과 수수료를 구분할 수 없다.
  fee_kr: 0.00015           # 위탁수수료(편도). 증권사·약정에 따라 다르다
  fee_us: 0.0025            # 해외주식 위탁수수료(편도)
  transaction_tax_kr: 0.0018  # 증권거래세 — **매도에만** 붙는다

# -----------------------------------------------------------------------------
# 매매
# -----------------------------------------------------------------------------

universe:
  min_turnover_20d_kr: 500000000     # 원
  min_turnover_20d_us: 1000000       # 달러
  min_listed_days: 180
  max_price_ratio: 0.15      # 1주 가격 / 자본
  exclude_flags: [관리종목, 거래정지, 정리매매]

execution:
  # **주문을 실제로 내보낼지.** 기본은 false — 켤 때만 나간다.
  # LS 모의투자 appkey 로는 주문 TR(CSPAT*) 자체가 막혀 있어서(ls_client.py),
  # 이걸 켜는 것은 곧 실계좌에 주문을 낸다는 뜻이다.
  live_trading: false
  max_adv_ratio: 0.03        # 일 거래대금 대비 매수 상한
  max_liquidation_days: 3
  defer_minutes: 30          # 개장 후 신규매수 보류
  order_type: limit          # 시장가는 청산·킬스위치에만
  max_slippage: 0.005
  slice_count: 4
  slice_interval_sec: 60
  retry_after_sec: 300
  max_retries: 3
  # 체결 시뮬레이터. 충격비용 = impact_k × 변동성 × √(주문량 / 일평균거래량)
  # 슬리피지를 고정값으로 두면 소형주 수익률이 뻥튀기된다.
  impact_k: 0.1
  min_order_value: 100000.0  # 이보다 작은 주문은 수수료가 잡아먹는다. 단위: 원

selector:
  n_candidates: 24
  corr_threshold: 0.7
  corr_penalty: 0.3
  sector_cap: 0.35
  population: 64
  generations: 40
  l1_penalty: 0.01

allocator:
  action_reflection_floor: 0.30   # 미만이면 경고 — RL이 아니라 룰 시스템이다
  # M3 룰 베이스라인. equal | score | score_inverse_vol
  # 기본을 score 로 두는 이유: M4 에서 RL 의 진짜 경쟁자가 될 것이기 때문이다.
  # 동일가중은 이기기 쉬운 상대라, 그걸 기준으로 삼으면 RL 이 실제로 나은지
  # 모르는 채로 승격시키게 된다.
  baseline: score
  max_position_weight: 0.15   # 한 종목이 이보다 커지면 분산이 아니다
  cash_buffer: 0.05           # 체결·수수료·환율 오차를 흡수할 여유
  episode_days: 250
  n_max_candidates: 30
  gamma: 0.997
  gae_lambda: 0.95

fx:
  rebalance_deadband: 0.10   # 10%p 넘을 때만 환전
  rebalance_weekday: FRI

killswitch:
  drawdown_trigger: 0.30
  order_fail_rate: 0.10
  liquidate_on_trigger: false     # 기본은 신규매수만 차단

backtest:
  # OOS 백테스트 MDD 상한. 킬스위치(0.30)보다 낮게 잡는 이유는 백테스트 MDD 가
  # 실전에서 거의 항상 더 나쁘기 때문이다 (reward-and-risk.md §승격 게이트).
  mdd_promotion_gate: 0.20
  # 성적에 넣지 않고 신호만 쌓는 선행 구간. confidence 가 60거래일 롤링 IC 라
  # 이력이 없으면 0 이고, 0 이면 합성 점수가 비어 아무것도 사지 않는다.
  warmup_days: 70

capital:
  gate_min_trading_days: 60
  gate_max_order_fail_rate: 0.01
  gate_max_missing_rate: 0.005
  gate_slippage_tolerance: 0.30
  step_multiplier: 2.5

# -----------------------------------------------------------------------------
# 분석
# -----------------------------------------------------------------------------

analyst:
  ic_threshold: 0.03         # 이 아래면 가중치 0(관찰 모드)
  ic_min_samples: 200        # 표본이 모자란 IC 는 우연과 구분되지 않는다
  ic_rolling_window: 60      # confidence 계산 창
  horizon_days: 5
  retrain_ic_floor: 0.01     # 이하로 떨어지면 재학습
  block_ratio_cap: 0.30      # 뉴스·SNS 하루 거부 상한
  verdict_ttl_days: 5

llm:
  monthly_budget_usd: 50
  news_screen_model: haiku
  news_deep_model: sonnet
  review_model: sonnet
  # 실제 청구 통화(USD)→원화 환산용. 대시보드 표시 참고치일 뿐, 청구는 USD.
  usd_krw_rate: 1450
  # 모델별 단가 — $/1M 토큰. 출처: claude-api 스킬 캐시(2026-06-24 기준,
  # platform.claude.com/docs/en/pricing 원본) + Anthropic 표준 캐시 배수
  # (cache_write = input×1.25, 5분 TTL / cache_read = input×0.1 — 모델 무관,
  # 참고 구현 ls_kr_rl_trader/dashboard/ai_review.py 의 opus-4-8 단가와 같은 공식).
  # 확인일: 2026-08-14. Sonnet 5 는 2026-08-31까지 도입가($2/$10)가 있으나
  # 그 뒤 정가로 돌아가므로 여기는 정가($3/$15)를 싣는다 — 안 그러면 도입가
  # 만료 때마다 config 를 또 고쳐야 한다. llm_usage.model 에 찍히는 실제 모델
  # 문자열(analysts/news_screen.py·macro_brief.py 의 MODEL 상수)과 키가 같아야
  # 화면이 단가를 찾는다 — 못 찾으면 "단가 모름" 으로 표시하지 0 으로 채우지 않는다.
  pricing:
    claude-opus-5:
      input_per_mtok: 5.00
      output_per_mtok: 25.00
      cache_write_per_mtok: 6.25
      cache_read_per_mtok: 0.50
    claude-sonnet-5:
      input_per_mtok: 3.00
      output_per_mtok: 15.00
      cache_write_per_mtok: 3.75
      cache_read_per_mtok: 0.30
    claude-haiku-4-5:
      input_per_mtok: 1.00
      output_per_mtok: 5.00
      cache_write_per_mtok: 1.25
      cache_read_per_mtok: 0.10

# -----------------------------------------------------------------------------
# 수집 — 구현하면서 실제로 필요했던 것들
# -----------------------------------------------------------------------------

collector:
  # 킬스위치가 보는 수집 오류율. 표본이 적을 때 성급히 끄면 잡음 하나로
  # 파이프라인이 멈춘다.
  error_rate_window_sec: 120.0
  error_rate_min_samples: 8
  call_history_sec: 600.0

backfill:
  years: 5
  # 일봉 공표 지연 — 세션 종료로부터 그 날 봉을 실제로 알 수 있게 되기까지.
  # 백필 레코드의 observed_at 은 "세션 종료 지역시각 + 이 지연" 이다.
  # 0 으로 두면 마감 종소리와 동시에 종가를 알았다는 뜻이 된다.
  kr_publication_lag_seconds: 1800    # 15:30 마감 → 16:00 공표
  us_publication_lag_seconds: 1200    # 16:00 마감 → 16:20 공표
  # 공매도는 세션 당일에 나오지 않는다. 거래일 단위로 늦춰 찍는다.
  # 0 으로 두면 flow_kr 이 통째로 미래를 본다.
  shorting_lag_days: 2
  session_pause_ms: 200      # 소스를 두들겨 차단당하지 않기 위한 예의
  # DART 는 공시 '날짜' 만 준다. 시각은 모른다. 그날 이 시각(KST)에 알게 됐다고
  # 본다 — 접수 마감이 18시이므로 그 이후로 잡으면 절대 낙관적이지 않다.
  dart_publication_hour_kst: 18
  # SEC EDGAR 도 공시 '날짜' 만 준다. 접수 마감이 17:30 ET 이므로 그 이후로
  # 잡으면 절대 낙관적이지 않다 — 그날 낸 공시는 다음 세션부터 반영된다.
  # (미장 일봉 관측시각이 16:20 ET 라 같은 날 공시는 그날 시총에 안 들어간다.)
  sec_filing_hour_et: 18

data:
  # 백테스트에 쓰는 파이프라인 지연. 실측 p90 으로 갱신하기 전의 보수적 초기값.
  # 가정한 지연과 실제 지연의 차이가 백테스트를 거짓말로 만든다.
  assumed_latency_seconds: 300

data_quality:
  coverage_warn: 0.98        # 거래일 커버리지가 이 아래면 경고
  missing_warn: 0.01
  latency_p90_warn_ms: 300000
  default_lookback_days: 90
  max_lookback_days: 400     # 화면 하나가 창고를 통째로 올리지 않게
  failure_rows: 50

system:
  # 시스템 탭 — "지금 이 시스템이 제대로 돌고 있는가" 의 임계치.
  job_stale_warn_hours: 30   # 크론은 평일 오후에 돈다. 주말·공휴일 여유를 둔다
  table_stale_warn_days: 3   # 최근 파티션이 이보다 오래되면 경고
  cache_lookback_days: 30    # LLM 캐시 적재 현황을 보는 창
