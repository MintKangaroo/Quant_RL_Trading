# RL 세션 피처 캐시 전용 설정 조각 (`allocator/cache.py` · `tools/build_rl_cache.py`).
#
# **왜 조각 파일인가.** `seed_config_defaults()` 를 인자 없이 부르면
# `config/quant_rl_trading.yaml` 전체를 심는데, 그러면 그 순간 다른 에이전트가
# 편집 중이던 미완성 값까지 창고에 확정된다. 여기 있는 두 키만 심으려면
# 조각으로 불러야 한다:
#
#     store.seed_config_defaults(path=Path("config/rl_cache.yaml"))
#
# 이 키들은 **굽는 쪽만 읽는다.** `allocator/env.py` 는 안 읽는다 — 캐시가
# 유효한 자본 하한은 파일 안의 ``equity_floor`` 표지에서 오므로, 환경이 설정을
# 다시 읽으면 굽던 때와 다른 값을 볼 수 있고 그 어긋남은 아무 데도 안 뜬다.

allocator:
  env:
    # 캐시를 굽는 자본(원). 후보 선정이 자본을 보는 곳은 딱 하나 —
    # "1주 가격이 자본의 15% 를 넘는 종목은 뺀다"(`selector/filters.py`).
    # 굽는 자본에서 그 이유로 탈락한 종목이 0개면, **그보다 큰 자본에서도**
    # 0개다(문턱이 올라가므로). 그래서 캐시는 이 값 이상의 자본에서 유효하다.
    #
    # 값의 근거: 에피소드 시작 자본 1억(`initial_capital`) × (1 − 낙폭 상한
    # 0.30, `reward.drawdown_hard`). 낙폭이 30% 에 닿으면 에피소드가 끝나므로
    # NAV 가 이 아래로 내려간 채 관측을 요구하는 경우가 없다. 둘 중 하나를
    # 바꾸면 이 값도 같이 바꿔야 하고, 안 바꾸면 캐시가 조용히 안 먹는다
    # (틀린 값을 내는 것이 아니라 창고 경로로 되돌아간다).
    cache_equity: 70000000.0

    # 캐시에 행을 남길 종목을 몇 세션 전까지 거슬러 모을 것인가(거래일).
    #
    # 그날 후보만 구우면 **보유 중인데 오늘 후보가 아닌 종목**이 매 스텝 창고로
    # 되돌아간다. 한 종목만 빠져도 시세·베타 조회가 통째로 다시 돌아 캐시의
    # 뜻이 없어진다 — 비용은 종목 수가 아니라 조회 횟수에 붙는다.
    #
    # **이 값은 속도에만 영향을 준다.** 덜 모으면 창고로 되돌아가는 일이
    # 늘 뿐이고, 더 모아도 종목별 계산이 독립이라 답이 달라지지 않는다.
    cache_carry_sessions: 60
