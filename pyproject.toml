[project]
name = "quant_rl_trading"
version = "0.1.0"
description = "Quant_RL_Trading — 멀티에이전트 AI 사모펀드"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "polars>=1.9",
    "flask>=3.0",
    "lightgbm>=4.5",
    "pydantic>=2.9",
    "httpx>=0.27",
    "exchange-calendars>=4.13.2",
    "pykrx>=1.2.8",
    "pyyaml>=6.0.3",
    "anthropic>=0.116",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_rl_trading"]

# -----------------------------------------------------------------------------
# ruff
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["quant_rl_trading", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 문서에서 "Analyst ×9" 처럼 쓴다. 오타가 아니다.
allowed-confusables = ["×"]

[tool.ruff.lint.isort]
known-first-party = ["quant_rl_trading", "tools"]

[tool.ruff.lint.per-file-ignores]
# 가드 테스트는 위반 소스를 문자열 fixture 로 들고 있어야 한다.
"tests/invariants/*" = ["E501"]

# -----------------------------------------------------------------------------
# mypy — quant_rl_trading/ 는 strict, 나머지는 느슨하게
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["quant_rl_trading", "tools"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# pyarrow 는 py.typed 를 싣지 않고, pandas 스텁은 설치 버전과 어긋난다.
# 게이트 안쪽에서만 쓰는 라이브러리라 여기서 끊는다.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "exchange_calendars.*", "pykrx.*", "yaml"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "invariant: CLAUDE.md 불변식 검증 — 커밋 전 필수 통과",
    # 오라클 카나리의 200k 스텝 원본(rl-training.md §0). 8분쯤 걸린다.
    # 실제로 건너뛰는 것은 tests/rl/conftest.py 다 — 표시만으로는 아무것도
    # 안 걸러진다. 전역 addopts 로 빼지 않는 이유도 거기 적혀 있다.
    "slow: 수 분 걸리는 시험. `-m slow` 로 따로 돌린다",
]
